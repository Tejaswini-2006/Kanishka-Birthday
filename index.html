<!DOCTYPE html>
<html>

<head>
    <title>Happy Birthday, Kanishka 🎉🌈</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            text-align: center;
            overflow: hidden;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e, #fad0c2, #ffecd2);
        }

        #background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        #background img.balloon {
            position: absolute;
            width: 50px;
            animation: float 5s infinite ease-in-out;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-20px);
            }
        }

        #card {
            position: relative;
            width: 300px;
            height: 450px;
            /* Increased height */
            margin: 80px auto;
            perspective: 1000px;
        }

        #card-inner {
            width: 100%;
            height: 100%;
            transition: transform 0.8s;
            transform-style: preserve-3d;
            cursor: pointer;
        }

        #card.open #card-inner {
            transform: rotateY(180deg);
        }

        #card-front,
        #card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }

        #card-front {
            background: linear-gradient(to bottom, #ffeb3b, #ff9800);
            /* Vibrant gradient */
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5em;
            color: #fff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        #card-back {
            background: linear-gradient(to bottom, #81c784, #4caf50);
            /* Green gradient */
            transform: rotateY(180deg);
            padding: 20px;
        }

        #cake {
            width: 150px;
            margin: 20px auto;
            height: 150px;
        }

        #candles {
            position: relative;
            width: 50px;
            margin: 10px auto;
        }

        #flame {
            position: absolute;
            top: -10px;
            left: 20px;
            width: 10px;
            height: 20px;
            background-color: orange;
            border-radius: 50% 50% 0 0;
            animation: flicker 1s infinite;
        }

        @keyframes flicker {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        #messages {
            text-align: left;
            margin-top: 20px;
            color: #fff;
        }

        #messages p {
            margin-bottom: 15px;
            border-bottom: 2px dashed rgba(255, 255, 255, 0.5);
            padding-bottom: 10px;
        }

        #messageInput {
            width: 90%;
            height: 120px;
            margin-top: 15px;
            border-radius: 10px;
            padding: 10px;
            border: 2px solid #ddd;
            font-family: inherit;
            background-color: rgba(255, 255, 255, 0.8);
        }

        #addMessage {
            background-color: #ff69b4;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.3s ease;
        }

        #addMessage:hover {
            background-color: #ff1493;
        }

        #funny-quote {
            margin-top: 20px;
            font-style: italic;
            color: #fff;
        }
    </style>
</head>

<body>

    <div id="background">
        <img src="https://media.giphy.com/media/7II84iF35yw5G/source.gif" class="balloon" style="top: 10%; left: 10%;">
        <img src="https://media.giphy.com/media/7II84iF35yw5G/source.gif" class="balloon" style="top: 10%; left: 10%;">
        <img src="https://media.giphy.com/media/7II84iF35yw5G/source.gif" class="balloon" style="top: 10%; left: 10%;">
        <img src="https://media.giphy.com/media/7II84iF35yw5G/source.gif" class="balloon" style="top: 10%; left: 10%;">
    </div>

    <div id="card">
        <div id="card-inner">
            <div id="card-front">
                🎉 Happy Birthday! 🎉
            </div>
            <div id="card-back">
                <img id="cake" src="https://th.bing.com/th?id=OIP.WXdyPFA9vD0JqRfaBvchDwHaLL&w=203&h=307&c=8&rs=1&qlt=90&o=6&dpr=1.3&pid=3.1&rm=2" alt="Birthday Cake">
                <div id="candles">
                    <div id="flame"></div>
                </div>
                <div id="messages">
                    <p><strong>Tejaswini:</strong> Happy birthday, Kanishka! May your day be as awesome as you are! 🎂🎈</p>
                </div>

                <button id="addMessage">Celebrating friendship on your birthday is my greatest joy. 💌</button>
                <p id="funny-quote">"Growing old is mandatory, but growing up is optional!"</p>
            </div>
        </div>
    </div>

    <script>
        const card = document.getElementById('card');
        const cardInner = document.getElementById('card-inner');
        const messageInput = document.getElementById('messageInput');
        const addMessage = document.getElementById('addMessage');
        const messagesDiv = document.getElementById('messages');

        card.addEventListener('click', () => {
            card.classList.toggle('open');
        });

        addMessage.addEventListener('click', () => {
            const message = messageInput.value;
            const newMessage = document.createElement('p');
            newMessage.innerHTML = "<strong>[Your Name]:</strong> " + message;
            messagesDiv.appendChild(newMessage);
            messageInput.value = '';
        });

        let balloons = document.querySelectorAll('.balloon');

        balloons.forEach(balloon => {
            balloon.style.left = Math.random() * 100 + '%';
            balloon.style.animationDelay = Math.random() * 3 + 's';
        });
    </script>

</body>

</html>
